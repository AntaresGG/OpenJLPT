name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Data + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validate the committed dataset against the schemas (no network).
      - run: npm run check:data
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      # The published package must build and its CLI must run.
      - run: npm run build:pkg && node dist/cli.js 食べる && node dist/cli.js stats
      - name: Website builds
        run: npx tsx scripts/build-site.ts /tmp/site && test -f /tmp/site/index.html
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build downloads into the site
        run: |
          python -m pip install genanki
          python scripts/build_exports.py /tmp/site/downloads
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: Upload static site for VPS deployment
        uses: actions/upload-artifact@v7
        with:
          name: openjlpt-site-${{ github.sha }}
          path: /tmp/site
          retention-days: 14
      # Grammar sources are hand-written: make sure the generated files are in sync.
      - name: Grammar output is up to date
        run: |
          npx tsx scripts/build-grammar.ts
          npx tsx scripts/prepare-data.ts
          git diff --exit-code -- data/json/grammar data/csv || (echo "::error::Run 'npm run build:grammar' and commit the result." && exit 1)

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest genanki
          python -m pip install -e .
      - run: python -m pytest
      - name: Anki decks and Yomitan dictionary build
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install genanki
          python scripts/build_exports.py /tmp/exports
      - name: Wheel bundles the data
        run: |
          python -m pip wheel . --no-deps -w wheelhouse
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install wheelhouse/*.whl
          cd /tmp && /tmp/venv/bin/openjlpt kanji 日
